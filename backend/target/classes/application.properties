# backend/src/main/resources/application.properties

# --- Active Profile ---
spring.profiles.active=dev

# --- App Info ---
spring.application.name=sportfacilitybooking

# --- Azure SQL Server Connection ---
spring.datasource.url=jdbc:sqlserver://huyht.database.windows.net:1433;\
  databaseName=sport-facility-booking-db;\
  encrypt=true;\
  trustServerCertificate=false;\
  loginTimeout=30

spring.datasource.username=huyht149
spring.datasource.password=Hoangthaihuy12!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Disable automatic naming strategy to match existing DB schema ---
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Flyway Migration ---
spring.flyway.locations=filesystem:../database/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0