spring:
  datasource:
    # Local: KHÔNG có ".database.windows.net" như production
    url: jdbc:sqlserver://${DB_SERVER}:1433;database=${DB_NAME};encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update   # OK để "update" lúc dev, KHÔNG dùng ở prod
    show-sql: true

server:
  port: 8080