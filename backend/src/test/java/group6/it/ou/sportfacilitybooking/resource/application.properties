# Config riêng cho test - dùng H2 in-memory, KHÔNG đụng tới Azure SQL thật.
# Spring Boot tự động dùng file này khi chạy test (không cần khai báo active profile),
# vì nó nằm trong classpath test và không có profile nào được set.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Tắt Flyway khi test - migration SQL Server-specific có thể không chạy được trên H2
spring.flyway.enabled=false